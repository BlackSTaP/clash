<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLESS to Clash YAML Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #ffffff;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #2c2c2c;
            color: #e0e0e0;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #45a049;
        }
        #output {
            background-color: #2c2c2c;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        #downloadBtn {
            background-color: #2196f3;
        }
        #downloadBtn:hover {
            background-color: #1e88e5;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VLESS to Clash YAML Converter</h1>
        <label for="vlessInput">Enter VLESS String:</label>
        <input type="text" id="vlessInput" placeholder="vless://uuid@server:port?...">
        <button id="convertBtn">Convert</button>
        <pre id="output"></pre>
        <button id="downloadBtn" class="hidden">Download Config YAML</button>
    </div>

    <script>
        function parseVless(url) {
            url = url.trim();
            if (!/^vless:\/\//i.test(url)) {
                throw new Error("Invalid VLESS URL");
            }

            const match = url.match(/^vless:\/\/([^@]+)@([^:]+):(\d+)\?([^#]*)#(.*)$/);
            if (!match) {
                throw new Error("Invalid VLESS URL format");
            }

            const uuid = match[1];
            const server = match[2];
            const port = parseInt(match[3], 10);
            const params = new URLSearchParams(match[4]);
            const name = decodeURIComponent(match[5]).trim() || "VPN";

            if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(uuid)) {
                throw new Error("Invalid UUID");
            }

            if (!Number.isInteger(port) || port < 1 || port > 65535) {
                throw new Error("Invalid port");
            }

            const security = (params.get("security") || "none").toLowerCase();
            const network = (params.get("type") || "tcp").toLowerCase();

            const proxy = {
                name: name,
                type: "vless",
                server: server,
                port: port,
                uuid: uuid,
                network: network,
                tls: security === "reality" || security === "tls",
                udp: true
            };

            if (security === "reality") {
                const publicKey = params.get("pbk");
                const shortId = params.get("sid");

                if (!publicKey) {
                    throw new Error("REALITY requires pbk");
                }

                if (!shortId) {
                    throw new Error("REALITY requires sid");
                }

                proxy.realityOpts = {
                    publicKey: publicKey,
                    shortId: shortId
                };

                if (params.get("sni")) {
                    proxy.servername = params.get("sni");
                }

                if (params.get("fp")) {
                    proxy.clientFingerprint = params.get("fp");
                }

                if (params.get("support-x25519mlkem768") === "true") {
                    proxy.supportX25519 = true;
                }
            } else if (security === "tls") {
                if (params.get("sni")) {
                    proxy.servername = params.get("sni");
                }

                if (params.get("fp")) {
                    proxy.clientFingerprint = params.get("fp");
                }
            } else if (params.get("pbk") || params.get("sid")) {
                throw new Error("REALITY parameters found but security is not reality");
            }

            const flow = params.get("flow");

            if (flow) {
                if (flow !== "xtls-rprx-vision") {
                    throw new Error("Unsupported flow: " + flow);
                }

                if (network !== "tcp") {
                    throw new Error("flow is only supported with TCP");
                }

                proxy.flow = flow;
            }

            return proxy;
        }

        function quote(value) {
            return JSON.stringify(String(value));
        }

        function generateYaml(proxy) {
            let yaml = "";
            yaml += "port: 7890\n";
            yaml += "socks-port: 7891\n";
            yaml += "mixed-port: 7893\n";
            yaml += "allow-lan: true\n";
            yaml += "mode: Rule\n";
            yaml += "log-level: info\n";
            yaml += "external-controller: 127.0.0.1:9090\n";
            yaml += "secret: \"\"\n\n";

            yaml += "dns:\n";
            yaml += "  enable: true\n";
            yaml += "  listen: 0.0.0.0:53\n";
            yaml += "  default-nameserver:\n";
            yaml += "    - 1.1.1.1\n";
            yaml += "    - 8.8.8.8\n";
            yaml += "  nameserver:\n";
            yaml += "    - https://dns.cloudflare.com/dns-query\n";
            yaml += "    - https://dns.google/dns-query\n";
            yaml += "  enhanced-mode: fake-ip\n";
            yaml += "  fake-ip-filter:\n";
            yaml += "    - \"+.*\"\n\n";

            yaml += "proxies:\n";
            yaml += "  - name: " + quote(proxy.name) + "\n";
            yaml += "    type: vless\n";
            yaml += "    server: " + quote(proxy.server) + "\n";
            yaml += "    port: " + proxy.port + "\n";
            yaml += "    uuid: " + quote(proxy.uuid) + "\n";
            yaml += "    network: " + proxy.network + "\n";
            yaml += "    tls: " + proxy.tls + "\n";

            if (proxy.realityOpts) {
                yaml += "    reality-opts:\n";
                yaml += "      public-key: " + quote(proxy.realityOpts.publicKey) + "\n";
                yaml += "      short-id: " + quote(proxy.realityOpts.shortId) + "\n";

                if (proxy.supportX25519) {
                    yaml += "      support-x25519mlkem768: true\n";
                }
            }

            if (proxy.servername) {
                yaml += "    servername: " + quote(proxy.servername) + "\n";
            }

            if (proxy.flow) {
                yaml += "    flow: " + proxy.flow + "\n";
            }

            if (proxy.clientFingerprint) {
                yaml += "    client-fingerprint: " + quote(proxy.clientFingerprint) + "\n";
            }

            yaml += "    udp: true\n\n";

            yaml += "proxy-groups:\n";
            yaml += "  - name: \"🔰 Proxy\"\n";
            yaml += "    type: select\n";
            yaml += "    proxies:\n";
            yaml += "      - " + quote(proxy.name) + "\n";
            yaml += "      - DIRECT\n\n";

            yaml += "rules:\n";
            yaml += "  - DOMAIN-SUFFIX,google.com,🔰 Proxy\n";
            yaml += "  - DOMAIN-SUFFIX,youtube.com,🔰 Proxy\n";
            yaml += "  - DOMAIN-KEYWORD,facebook,🔰 Proxy\n";
            yaml += "  - DOMAIN-SUFFIX,github.com,🔰 Proxy\n";
            yaml += "  - GEOIP,CN,DIRECT\n";
            yaml += "  - MATCH,🔰 Proxy\n";

            return yaml;
        }

        function redactYaml(yaml) {
            return yaml
                .replace(/^(    server: ).*$/m, "$1[REDACTED]")
                .replace(/^(    uuid: ).*$/m, "$1[REDACTED]")
                .replace(/^(      public-key: ).*$/m, "$1[REDACTED]")
                .replace(/^(      short-id: ).*$/m, "$1[REDACTED]");
        }

        let fullYaml = "";

        function convertVless() {
            const input = document.getElementById("vlessInput").value.trim();

            if (!input) {
                alert("Please enter a VLESS string.");
                return;
            }

            try {
                const proxy = parseVless(input);
                fullYaml = generateYaml(proxy);

                document.getElementById("output").textContent = redactYaml(fullYaml);
                document.getElementById("downloadBtn").classList.remove("hidden");
            } catch (error) {
                alert(error.message);
            }
        }

        function downloadYaml() {
            if (!fullYaml) {
                return;
            }

            const blob = new Blob([fullYaml], { type: "text/yaml" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.href = url;
            link.download = "clash-config.yaml";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        document.getElementById("convertBtn").addEventListener("click", convertVless);
        document.getElementById("downloadBtn").addEventListener("click", downloadYaml);
    </script>
</body>
</html>
